<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - School Management</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.css" />
</head>
<body class="bg-light">
  <div class="container py-5"><div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-8 col-lg-5"><div class="card shadow-3"><div class="card-body p-4 p-md-5"><div class="text-center mb-4"><h1 class="h4 mb-1">School Management Login</h1><p class="text-muted mb-0">Sign in to continue</p></div><div class="form-outline mb-4"><input type="email" id="loginEmail" class="form-control" /><label class="form-label" for="loginEmail">Email</label></div><div class="form-outline mb-4"><input type="password" id="loginPassword" class="form-control" /><label class="form-label" for="loginPassword">Password</label></div><button class="btn btn-primary btn-block mb-3">Login</button><div class="alert alert-info mb-0" role="alert">Use your school admin account credentials.</div></div></div></div></div></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.2/mdb.min.js"></script>
</body>
</html>
